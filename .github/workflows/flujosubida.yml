# This is a basic workflow to help you get started with Actions

name: Integración y entrega continua

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build".
  build:
    env:
      #Declarar y definir mis variables de entorno
      MY_VAR: "Mis variables de entorno"
      nombres: "Marita Lizet"          
      apellidos: "Quispe Rodriguez"       
      edad: "35"     

      #Declarar y definir mis variables secretas
      user: ${{secrets.USER}}
      password: ${{secrets.PASSWORD}}

     
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.


       # 1er step: Presentación - Impresion varible de entorno
      - name: Presentacion
        run: |
          echo "Mis nombres son: ${{env.nombres}}"
          echo "Mis apellidos son: ${{env.apellidos}}"
          echo "Mi edad: ${{env.edad}}"

       # 2do step: Datos grales - impresion
      - name: Datos generales
        run: |
          echo Carrera de Ingeneria de Sistemas.
         
        # 3er step: Impresion de varibles secretas
      - name: Variables secretas 
        run: |
          echo "El usuario es: ${{env.user}}"
          echo "La contraseña  es: ${{env.password}}"
         
        # 4to step: variables abiertas
      - name: variables abiertas
        run: |
          echo Versión del Proyecto: ${{vars.VERSION_PROYECTO}}